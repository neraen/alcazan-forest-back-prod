nelmio_cors:
    defaults:
        origin_regex: true
        # Origines autorisées : pilotées par CORS_ALLOW_ORIGIN (.env / docker-compose).
        # Plus de wildcard '*' : localhost/127.0.0.1 uniquement par défaut.
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization']
        expose_headers: ['Link']
        max_age: 3600
    paths:
        '^/api/': ~
