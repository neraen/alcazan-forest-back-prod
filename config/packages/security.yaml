security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        registration:
            pattern: ^/api/users
            stateless: true
            methods: [POST]

        login:
            pattern: ^/api/login_check
            stateless: true
            json_login:
                check_path: /api/login_check
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~  # Utilisation de JWT sans référence à un authenticator spécifique

        main:
            lazy: true
            provider: app_user_provider

    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/users, roles: PUBLIC_ACCESS }
        # Outils d'administration (MapMaker, QuestMaker, etc.) : réservés aux admins
        # Le QuestMaker entier (lectures comprises) vit sous /api/quest/editor.
        - { path: ^/api/quest/editor, roles: ROLE_ADMIN }
        # Idem pour le DonjonMaker : /api/donjon/editor est admin, /api/donjon/* reste joueur.
        - { path: ^/api/donjon/editor, roles: ROLE_ADMIN }
        - { path: ^/api/shop/editor, roles: ROLE_ADMIN }
        # L'InteractionMaker est admin ; /api/interaction/executer reste une route joueur.
        - { path: ^/api/interaction/editor, roles: ROLE_ADMIN }
        # L'ArtisanatMaker est admin ; /api/craft/* et /api/metier/* restent joueur.
        - { path: ^/api/artisanat/editor, roles: ROLE_ADMIN }
        # Upload d'images depuis l'admin (métiers, objets, PNJ, monstres, interactions).
        - { path: ^/api/admin/, roles: ROLE_ADMIN }
        - { path: ^/api/(map|pnj|monstre|equipement)/(create|update|upload-icone|import-csv), roles: ROLE_ADMIN }
        - { path: ^/insert, roles: ROLE_ADMIN }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
